name: student_potal_aup
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  lottie: ^3.1.2
  animated_splash_screen: ^1.3.0
  flutter_screenutil: ^5.9.3
  popover: ^0.3.0+1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  firebase_core: ^3.2.0
  firebase_storage: ^12.1.1
  http: ^1.2.2
  flutter_launcher_icons: ^0.13.1
  liquid_pull_to_refresh: ^3.0.1
  open_file: ^3.5.3
  path_provider: ^2.1.4
  dio: ^5.7.0
  cached_network_image: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-logo-2.png"
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  assets:
#
    - assets/splashScreen/
    - assets/lotties/
    - assets/images/
    - assets/docs/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
